name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^VERSION=\([0-9.]*\).*/\1/p' bundle.sh)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION=$version in bundle.sh"
            exit 1
          fi

      - run: swift test
      - run: ./bundle.sh

      # Re-signs the ad-hoc build with the one release identity: every version
      # then has the same designated requirement, so macOS keeps the
      # Accessibility grant across updates. doctor fails the release on a bad app.
      - uses: te-o-o-o/macseal-builder@v0.1.0
        with:
          app: .build/wrkspaces.app
          p12: ${{ secrets.MACOS_CERT_P12 }}
          password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Zip the app
        run: ditto -c -k --norsrc --noextattr --keepParent .build/wrkspaces.app wrkspaces-macos-universal.zip

      - name: Make the disk image
        run: |
          # The app next to an Applications link: open it and drag one onto the other.
          mkdir dmg
          cp -R .build/wrkspaces.app dmg/
          ln -s /Applications dmg/Applications
          # The default APFS image with zlib was 766 KB; HFS+ with lzma is 333 KB (opens on macOS 10.15+).
          hdiutil create -volname wrkspaces -srcfolder dmg -ov -fs HFS+ -format ULMO wrkspaces-macos-universal.dmg

      - name: Write the release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          # The CHANGELOG section of this version, without its title.
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install

          Download `wrkspaces-macos-universal.dmg`, open it and drag `wrkspaces.app` onto Applications. The `.zip` holds the same app.

          The app is not signed with an Apple Developer ID, so macOS blocks it on first launch. Either right-click it and pick **Open**, or run once:

          ```sh
          xattr -d com.apple.quarantine /Applications/wrkspaces.app
          ```

          Then grant Accessibility access when asked. Updates keep it: every release is signed with the same key. Coming from 0.1.9 or earlier, remove wrkspaces from the Accessibility list and grant it one last time.
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" wrkspaces-macos-universal.dmg wrkspaces-macos-universal.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
